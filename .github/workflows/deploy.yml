name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 核心修改：手动下载并安装 Hugo 0.156.1 extended
      - name: Install Hugo 0.156.1 extended
        run: |
          # 下载 Hugo 安装包（Linux/amd64 版本，验证过可访问）
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.156.1/hugo_extended_0.156.1_linux-amd64.tar.gz
          # 解压到 /usr/local/bin（系统可执行目录）
          tar -xzf hugo_extended_0.156.1_linux-amd64.tar.gz hugo
          sudo mv hugo /usr/local/bin/
          # 验证版本（关键：确保安装成功）
          hugo version

      - name: Build
        run: |
          hugo clean
          hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public