name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 关键修复：升级到 actions-hugo@v3
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3  # 从 v2 升级到 v3
        with:
          hugo-version: '0.156.1'       # 目标版本
          extended: true                # 必须开启 extended

      - name: Build
        run: |
          hugo clean
          hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public