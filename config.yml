baseURL: "https://kwok-ai.github.io/"
title: "KwokChung's Blog"
theme: 
  - PaperMod
  - hugo-shortcode-gallery
languageCode: "zh"
defaultContentLanguage: "zh"

# 元数据
description: "记录技术、生活和思考"
keywords: ["博客", "技术", "编程"]
author: "KwokChung"

paginate: 10
paginatePath: "page"
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pygmentsUseClasses: true  # 语法高亮
mainsections:
  - posts  # 主要内容位置，SEO 相关

params:
  customCSS: extended/list-style.css
  # 首页设置
  homeInfoParams:
    Title: "欢迎来到我的博客"
    Content: |
      你好！我是[KwokChung]，一名投身于基础教育领域的信息科技教师。教学之外，编程是我持续了多年的业余热忱，编程与教学是相互滋养的，代码世界严谨的逻辑锤炼了我的教学框架，而教育中所需的耐心与沟通艺术，也让我在调试bug时多了一份从容。
      
      期待与你交流一切关于技术、学习与创造的思考。
      
      - 📚 记录学习笔记
      - 🛠️  分享开发经验
      - 🚀 探索技术前沿
  customHead: |
    <!-- 加载 jQuery（画廊核心依赖） -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <!-- 加载画廊依赖的插件 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-lazy@1.7.11/jquery.lazy.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swipebox@1.4.4/src/js/jquery.swipebox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/js/jquery.justifiedGallery.min.js"></script>
    <!-- 加载画廊所需 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swipebox@1.4.4/src/css/swipebox.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/css/justifiedGallery.min.css">
  
  # 文章设置
  showPostSummary: true
  showReadingTime: true
  showWordCount: true
  showBreadCrumbs: true
  showCodeCopyButtons: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  ShowPostNavLinks: true  # 文章末尾导航栏
  ShowAllPagesInArchive: true  # 显示所有页面在时间轴页面
  ShowPageNums: true  # 显示页码
  ShowFullTextinRSS: true  # 在 RSS 中显示全文
  ShowToc: true  # 显示目录
  TocOpen: false  # 自动展开目录

  cover:
    hiddenInList: true
    hiddenInSingle: false
    
  # 基础开关
  search: true
  showSearchButton: true
  showSearchIcon: true
  
  
  # Fuse.js 配置
  fusejs:
    enable: true
    options:
      isCaseSensitive: false
      threshold: 0.4
      keys: 
        - { name: "title", weight: 3 }
        - { name: "tags", weight: 2 }
        - { name: "summary", weight: 1.5 }
        - { name: "content", weight: 1 }
    
  # 界面配置
  showSearchButton: true
  searchStyle: "modal"
  searchAutoFocus: true
  
  # 搜索页面
  searchPage:
    enable: true
    placeholder: "搜索文章..."
    
  # 快捷键
  searchShortcut:
    enable: true
    key: "k"
    
  # 搜索结果
  searchResultContents: true
  searchResultLength: 60
  searchResultMax: 10
  
  # 社交链接
  socialIcons:
    - name: github
      url: "https://github.com/kwok-ai"
      title: "访问我的GitHub"
    - name: WeChat
      url: "images/wechat.png"
      title: "关注微信公众号"
    - name: email
      url: "mailto:40429927@qq.com"
      title: "发送邮件"
    - name: rss
      url: "/index.xml"
      title: "RSS订阅"
    
  share:
    enable: true
    Twitter: true
    Facebook: true
    Linkedin: true
    
# 菜单
menu:
  main:
    - identifier: home
      name: 🏠 首页
      url: /
      weight: 1
    - identifier: posts
      name: 📝 文章
      url: /posts/
      weight: 2
    - identifier: tags
      name: 🏷️ 标签
      url: /tags/
      weight: 3  
    - identifier: search
      name: 🔍 搜索
      url: /search/
      weight: 4

outputs:
  home:
    - HTML
    - RSS
    - JSON
